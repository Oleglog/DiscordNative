name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.2.5)'
        required: false
        default: 'v0.2.5'
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Application
        shell: powershell
        run: |
          .\build.ps1 -Configuration Release -NoRun

      - name: Package Release
        id: package
        shell: powershell
        run: |
          $ver = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($ver)) {
            if ("${{ github.ref }}" -like "refs/tags/*") {
              $ver = "${{ github.ref_name }}"
            } else {
              $ver = "v0.2.5"
            }
          }
          Write-Host "Packaging version: $ver"
          .\package_release.ps1 -Version $ver
          echo "VERSION=$ver" >> $env:GITHUB_ENV

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Diswin-${{ env.VERSION }}
          path: dist/*.zip

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Diswin ${{ env.VERSION }}
          files: dist/*.zip
          body: |
            ## Diswin ${{ env.VERSION }} Release

            ### 🚀 Updates:
            - **🔑 Token Quick-Switch Button**: Added a direct button inside the 2FA panel to immediately switch to Token login if Discord's anti-bot system blocks 2FA.
            - **🛡️ Two-Way Fallback**: Added automatic fallback between TOTP (6-digit) and Backup (8-character) code endpoints.
            - **⚡ Fix ASCII Header**: Local timezone header converted to ASCII IANA or UTC.
            - **🧹 Clean Serialization**: No null values sent to Discord API.
