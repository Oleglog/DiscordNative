name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.2.3)'
        required: false
        default: 'v0.2.3'
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Application
        shell: powershell
        run: |
          .\build.ps1 -Configuration Release -NoRun

      - name: Package Release
        id: package
        shell: powershell
        run: |
          $ver = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($ver)) {
            if ("${{ github.ref }}" -like "refs/tags/*") {
              $ver = "${{ github.ref_name }}"
            } else {
              $ver = "v0.2.3"
            }
          }
          Write-Host "Packaging version: $ver"
          .\package_release.ps1 -Version $ver
          echo "VERSION=$ver" >> $env:GITHUB_ENV

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Diswin-${{ env.VERSION }}
          path: dist/*.zip

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Diswin ${{ env.VERSION }}
          files: dist/*.zip
          body: |
            ## Diswin ${{ env.VERSION }} Release

            ### 🚀 What's New & Fixed:
            - **🔑 Direct Token Login**: Added a dedicated "Jeton (Token)" login tab allowing direct authentication via Discord user token, completely bypassing MFA/Cloudflare/hCaptcha blocks.
            - **🛡️ 2FA Multi-Method Support**: Added detection and selection for Authenticator App (TOTP), SMS verification (with a direct "Envoyer un SMS" button), and Backup codes.
            - **🧹 Clean JSON Serialization**: Configured `JsonIgnoreCondition.WhenWritingNull` to strictly omit null fields in authentication payloads, matching official Discord web client expectations.
            - **🔄 Automatic Method Fallback**: If an 8-character code is submitted under TOTP, it automatically attempts backup code validation.
            - **🌍 Localized Headers**: Added local system timezone support to `X-Discord-Timezone` header.
            - **📋 Input Truncation Removed**: Removed the 8-character limit on the 2FA text box to allow codes of varying lengths, spaces, and hyphens.
